// ── DATE / WEEK HELPERS ──────────────────────────────────────────────────────
function getISOWeek(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  const wk = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  return d.getUTCFullYear() + '-W' + String(wk).padStart(2, '0');
}

function weekLabel(isoWeek) {
  const [yr, wStr] = isoWeek.split('-W');
  const week = parseInt(wStr, 10);
  const jan4 = new Date(parseInt(yr), 0, 4);
  const startMs = jan4.getTime() - (jan4.getDay() || 7) * 86400000 + (week - 1) * 7 * 86400000;
  const start = new Date(startMs);
  return 'Week of ' + start.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function addWeeks(isoWeek, delta) {
  const [yr, wStr] = isoWeek.split('-W');
  const week = parseInt(wStr, 10);
  const jan4 = new Date(parseInt(yr), 0, 4);
  const startMs = jan4.getTime() - (jan4.getDay() || 7) * 86400000 + (week - 1) * 7 * 86400000;
  const newDate = new Date(startMs + delta * 7 * 86400000 + 3 * 86400000);
  return getISOWeek(newDate);
}

// ── STORAGE HELPERS ──────────────────────────────────────────────────────────
function parKey(store)          { return 'ks_par_' + store; }
function logKey(store, isoWeek) { return 'ks_log_' + store + '_' + isoWeek; }

function loadPar(store) {
  try { return JSON.parse(localStorage.getItem(parKey(store)) || 'null') || {}; }
  catch { return {}; }
}
function savePar(store, data) {
  localStorage.setItem(parKey(store), JSON.stringify(data));
}

function loadLog(store, isoWeek) {
  try { return JSON.parse(localStorage.getItem(logKey(store, isoWeek)) || 'null') || {}; }
  catch { return {}; }
}
function saveLog(store, isoWeek, data) {
  localStorage.setItem(logKey(store, isoWeek), JSON.stringify(data));
  pruneOldLogs(store, isoWeek);
}

function pruneOldLogs(store, currentWeek) {
  const cutoff = addWeeks(currentWeek, -2);
  Object.keys(localStorage).forEach(k => {
    if (!k.startsWith('ks_log_' + store + '_')) return;
    const wk = k.replace('ks_log_' + store + '_', '');
    if (wk < cutoff) localStorage.removeItem(k);
  });
}

// ── DEEP SET HELPER ──────────────────────────────────────────────────────────
function deepSet(obj, path, value) {
  if (path.length === 0) return value;
  const [head, ...rest] = path;
  return { ...obj, [head]: deepSet(obj[head] || {}, rest, value) };
}

    padding: 6px 12px; border-radius: 7px; font-size: 12px; font-weight: 700;
    cursor: pointer; border: none; transition: opacity .15s;
  }
  .btn-print-blank  { background: rgba(255,255,255,.15); color: #fff; border: 1px solid rgba(255,255,255,.3); }
  .btn-print-blank:hover  { background: rgba(255,255,255,.25); }
  .btn-print-filled { background: ${GOLD}; color: ${NAVY}; }
  .btn-print-filled:hover { opacity: .88; }

  /* ── Tab nav ── */
  .tab-nav {
    display: flex; gap: 6px; padding: 10px 14px 0;
    overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
    background: ${NAVY};
  }
  .tab-nav::-webkit-scrollbar { display: none; }
  .tab-pill {
    flex-shrink: 0; padding: 6px 14px; border-radius: 20px 20px 0 0;
    border: 1.5px solid rgba(255,255,255,.2); border-bottom: none;
    background: rgba(255,255,255,.08); color: rgba(255,255,255,.6);
    font-size: 12px; font-weight: 700; cursor: pointer; transition: all .15s;
  }
  .tab-pill:hover { background: rgba(255,255,255,.15); color: #fff; }
  .tab-pill.on { background: #f0f2f5; color: ${NAVY}; border-color: #f0f2f5; }

  /* ── Content area ── */
  .content-area { padding: 14px; }

  /* ── Tab panels ── */
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ── Day grid ── */
  .day-grid {
    display: grid; grid-template-columns: repeat(6, 1fr);
    gap: 8px; align-items: start;
  }
  .day-col {
    background: #fff; border-radius: 10px; overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,.10);
  }
  .day-header {
    padding: 8px 6px; text-align: center; font-size: 13px; font-weight: 900;
    color: #fff; text-transform: uppercase; letter-spacing: .5px; line-height: 1.3;
  }
  .day-full { font-size: 9px; font-weight: 600; opacity: .75; display: block; }
  .day-items { padding: 6px 5px; }

  /* ── Weekly menu items ── */
  .section-badge {
    font-size: 9px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase;
    border: 1px solid; border-radius: 4px; padding: 1px 5px;
    margin: 6px 0 3px; display: inline-block; opacity: .85;
  }
  .item-row { font-size: 11px; padding: 2px 2px; color: #2a2a2a; line-height: 1.4; }
  .item-row:nth-child(odd) { background: #f8f9fb; border-radius: 3px; }

  /* ── Pull day notice ── */
  .pull-day-notice {
    text-align: center; padding: 20px 8px; background: linear-gradient(135deg, rgba(74,35,90,.06), rgba(74,35,90,.12));
  }
  .pull-day-icon { font-size: 28px; }
  .pull-day-text { font-size: 13px; font-weight: 800; color: #4A235A; margin-top: 4px; }
  .pull-day-sub  { font-size: 10px; color: #777; margin-top: 2px; }

  .empty-day { text-align: center; padding: 20px 8px; font-size: 11px; color: #aaa; font-style: italic; }

  /* ── Form rows ── */
  .form-col-headers {
    display: grid; grid-template-columns: 1fr 36px 36px; gap: 2px;
    padding: 4px 2px; border-bottom: 1.5px solid #e8eaf0; margin-bottom: 2px;
    font-size: 9px; font-weight: 800; text-transform: uppercase; color: #888; letter-spacing: .4px;
  }
  .form-col-headers.cw { grid-template-columns: 1fr 30px 36px 36px; }
  .form-row {
    display: grid; grid-template-columns: 1fr 36px 36px; gap: 2px;
    align-items: center; padding: 2px 2px; border-radius: 3px;
  }
  .form-row.cw { grid-template-columns: 1fr 30px 36px 36px; }
  .form-row:nth-child(even) { background: #f8f9fb; }
  .cond-row .col-item { font-style: italic; color: #999; font-size: 10px; }
  .col-item { font-size: 10.5px; color: #1a1a1a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .col-num  { font-size: 10px; text-align: center; color: #666; }
  .num-input {
    width: 100%; text-align: center; font-size: 12px; font-weight: 700;
    border: 1px solid #dde1e8; border-radius: 4px; padding: 2px 1px;
    color: ${NAVY}; background: #fff; appearance: textfield;
    transition: border-color .15s;
  }
  .num-input:focus { outline: none; border-color: #1565C0; background: #f0f4ff; }
  .num-input::-webkit-outer-spin-button,
  .num-input::-webkit-inner-spin-button { -webkit-appearance: none; }

  /* ── Grab & Go ── */
  .gg-wrap { max-width: 560px; margin: 0 auto; }
  .gg-table { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.10); }
  .gg-header {
    display: grid; grid-template-columns: 1fr 60px 70px 70px;
    padding: 10px 12px; gap: 8px;
  }
  .gg-row {
    display: grid; grid-template-columns: 1fr 60px 70px 70px;
    padding: 5px 12px; gap: 8px; align-items: center; border-top: 1px solid #f0f2f5;
  }
  .gg-row.even { background: #f8f9fb; }
  .gg-row .col-item { font-size: 12px; }
  .gg-row .num-input { font-size: 13px; padding: 3px 2px; }

  /* ── Print only ── */
  .print-only { display: none; }

  /* ── PRINT ── */
  @media print {
    .no-print  { display: none !important; }
    .print-only { display: block !important; }

    body { background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    @page { size: letter landscape; margin: 0.35in; }

    .content-area { padding: 0; }

    /* Show all panels, each on its own page */
    .tab-panel { display: block !important; page-break-after: always; }
    .tab-panel:last-child { page-break-after: avoid; }

    .day-grid { gap: 4px; }
    .day-col  { box-shadow: none; border: 1px solid #ddd; }
    .day-header { padding: 5px 4px; font-size: 11px; }
    .item-row { font-size: 9px; padding: 1px 2px; }
    .form-col-headers { font-size: 8px; }
    .form-row { padding: 1px 2px; }
    .col-item { font-size: 9px; }

    .num-input {
      border: none; border-bottom: 1px solid #aaa; border-radius: 0;
      background: transparent; color: #000; font-size: 10px;
    }
    body.print-blank .num-input { color: transparent !important; }

    .gg-table { box-shadow: none; border: 1px solid #ddd; }
    .gg-header { padding: 6px 8px; }
    .gg-row { padding: 3px 8px; }
    .gg-row .col-item { font-size: 10px; }
    .gg-row .num-input { font-size: 10px; }

    .section-print-header {
      font-size: 13px; font-weight: 900; color: ${NAVY};
      border-bottom: 2px solid ${GOLD}; padding-bottom: 4px;
      margin-bottom: 8px; letter-spacing: .3px;
    }
    .print-header {
      font-size: 12px; color: #333; text-align: center;
      padding: 0 0 6px; margin-bottom: 8px;
      border-bottom: 1.5px solid ${NAVY};
    }
  }
`;

ReactDOM.createRoot(document.getElementById('root')).render(<WeeklyMenuApp/>);
</script>
</body>
</html>

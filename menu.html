// ── DATE / WEEK HELPERS ───────────────────────────────────────────────────────
function getISOWeek(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  const wk = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  return d.getUTCFullYear() + '-W' + String(wk).padStart(2, '0');
}

function weekLabel(isoWeek) {
  const [yr, wStr] = isoWeek.split('-W');
  const week = parseInt(wStr, 10);
  const jan4 = new Date(parseInt(yr), 0, 4);
  const startMs = jan4.getTime() - (jan4.getDay() || 7) * 86400000 + (week - 1) * 7 * 86400000;
  return 'Week of ' + new Date(startMs).toLocaleDateString('en-US',
    { month: 'short', day: 'numeric', year: 'numeric' });
}

function addWeeks(isoWeek, delta) {
  const [yr, wStr] = isoWeek.split('-W');
  const week = parseInt(wStr, 10);
  const jan4 = new Date(parseInt(yr), 0, 4);
  const startMs = jan4.getTime() - (jan4.getDay() || 7) * 86400000 + (week - 1) * 7 * 86400000;
  const newDate = new Date(startMs + delta * 7 * 86400000 + 3 * 86400000);
  return getISOWeek(newDate);
}

function todayDayName() {
  return ['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'][new Date().getDay()];
}

// ── STORAGE HELPERS ───────────────────────────────────────────────────────────
function parKey(store)          { return 'ks_par_' + store; }
function logKey(store, isoWeek) { return 'ks_log_' + store + '_' + isoWeek; }

function loadPar(store) {
  try { return JSON.parse(localStorage.getItem(parKey(store)) || 'null') || {}; }
  catch { return {}; }
}
function savePar(store, data) { localStorage.setItem(parKey(store), JSON.stringify(data)); }

function loadLog(store, isoWeek) {
  try { return JSON.parse(localStorage.getItem(logKey(store, isoWeek)) || 'null') || {}; }
  catch { return {}; }
}
function saveLog(store, isoWeek, data) {
  localStorage.setItem(logKey(store, isoWeek), JSON.stringify(data));
  // prune entries older than 2 weeks
  const cutoff = addWeeks(isoWeek, -2);
  Object.keys(localStorage).forEach(k => {
    if (!k.startsWith('ks_log_' + store + '_')) return;
    const wk = k.replace('ks_log_' + store + '_', '');
    if (wk < cutoff) localStorage.removeItem(k);
  });
}

function deepSet(obj, path, value) {
  if (path.length === 0) return value;
  const [head, ...rest] = path;
  return { ...obj, [head]: deepSet(obj[head] || {}, rest, value) };
}

// ── MAIN APP ──────────────────────────────────────────────────────────────────
function WeeklyMenuApp() {
  const params    = new URLSearchParams(window.location.search);
  const store     = params.get('store') || 'demo';
  const storeName = params.get('name')  || "Keith's Superdeli";

  const [activeTab,  setActiveTab]  = useState('menu');
  const [isoWeek,    setIsoWeek]    = useState(() => getISOWeek(new Date()));
  const [parData,    setParData]    = useState(() => loadPar(store));
  const [logData,    setLogData]    = useState(() => loadLog(store, getISOWeek(new Date())));
  const [saveStatus, setSaveStatus] = useState('');
  const saveTimer = React.useRef(null);

  useEffect(() => { setLogData(loadLog(store, isoWeek)); }, [isoWeek]);

  const flashSaved = () => {
    setSaveStatus('✓ Saved');
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => setSaveStatus(''), 2000);
  };

  const updateLog = useCallback((path, value) => {
    setLogData(prev => {
      const next = deepSet({ ...prev }, path, value);
      saveLog(store, isoWeek, next);
      return next;
    });
    flashSaved();
  }, [store, isoWeek]);

  const updatePar = useCallback((path, value) => {
    setParData(prev => {
      const next = deepSet({ ...prev }, path, value);
      savePar(store, next);
      return next;
    });
    flashSaved();
  }, [store]);

  const printBlank = () => {
    document.body.classList.add('print-blank');
    window.print();
    setTimeout(() => document.body.classList.remove('print-blank'), 500);
  };

  const TABS = [
    { id: 'menu',  label: '📋 Weekly Menu' },
    { id: 'pull',  label: '📦 Pull Sheet' },
    { id: 'deli',  label: '🍳 Deli C/W' },
    { id: 'bfast', label: '🥞 Breakfast C/W' },
    { id: 'gg',    label: '🛍 Grab & Go C/W' },
  ];

  return (
    <>
      <style>{CSS}</style>

      {/* APP HEADER */}
      <div className="app-header no-print">
        <div className="hd-brand">
          <div className="hd-title">🥩 Keith's Superdeli</div>
          {storeName !== "Keith's Superdeli" && <div className="hd-store">{storeName}</div>}
        </div>
        <div className="hd-right">
          <div className="week-nav">
            <button className="wk-btn" onClick={() => setIsoWeek(w => addWeeks(w, -1))}>‹</button>
            <span className="wk-label">{weekLabel(isoWeek)}</span>
            <button className="wk-btn" onClick={() => setIsoWeek(w => addWeeks(w, 1))}>›</button>
          </div>
          {saveStatus && <span className="save-badge">{saveStatus}</span>}
          <button className="btn-blank"  onClick={printBlank}>🖨 Blank</button>
          <button className="btn-filled" onClick={() => window.print()}>🖨 Filled</button>
        </div>
      </div>

      {/* PRINT HEADER */}
      <div className="print-header print-only">
        <strong>{storeName}</strong> — Keith's Superdeli · {weekLabel(isoWeek)}
      </div>

      {/* TAB NAV */}
      <div className="tab-nav no-print">
        {TABS.map(t => (
          <button
            key={t.id}
            className={'tab-pill' + (activeTab === t.id ? ' on' : '')}
            onClick={() => setActiveTab(t.id)}
          >{t.label}</button>
        ))}
      </div>

      {/* CONTENT */}
      <div className="content">
        <div className={'panel' + (activeTab === 'menu'  ? ' active' : '')} data-label="Weekly Menu">
          <div className="print-sec-hdr print-only">📋 Weekly Menu</div>
          <WeeklyMenuTab />
        </div>
        <div className={'panel' + (activeTab === 'pull'  ? ' active' : '')} data-label="Pull Sheet">
          <div className="print-sec-hdr print-only">📦 Pull Sheet</div>
          <PullSheetTab store={store} isoWeek={isoWeek} parData={parData} logData={logData} updatePar={updatePar} updateLog={updateLog} />
        </div>
        <div className={'panel' + (activeTab === 'deli'  ? ' active' : '')} data-label="Cook/Waste — Deli">
          <div className="print-sec-hdr print-only">🍳 Cook/Waste — Hot Food Deli</div>
          <CWDeliTab store={store} isoWeek={isoWeek} parData={parData} logData={logData} updatePar={updatePar} updateLog={updateLog} />
        </div>
        <div className={'panel' + (activeTab === 'bfast' ? ' active' : '')} data-label="Cook/Waste — Breakfast">
          <div className="print-sec-hdr print-only">🥞 Cook/Waste — Breakfast</div>
          <CWBreakfastTab store={store} isoWeek={isoWeek} parData={parData} logData={logData} updatePar={updatePar} updateLog={updateLog} />
        </div>
        <div className={'panel' + (activeTab === 'gg'    ? ' active' : '')} data-label="Grab &amp; Go">
          <div className="print-sec-hdr print-only">🛍 Cook/Waste — Grab &amp; Go</div>
          <GrabGoTab store={store} isoWeek={isoWeek} parData={parData} logData={logData} updatePar={updatePar} updateLog={updateLog} />
        </div>
      </div>
    </>
  );
}

// ── CSS ───────────────────────────────────────────────────────────────────────
const CSS = `
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, system-ui, sans-serif; background: #f0f2f5; color: #1a1a1a; }

  /* APP HEADER */
  .app-header {
    display: flex; align-items: center; justify-content: space-between;
    background: ${NAVY}; padding: 10px 14px; gap: 10px; flex-wrap: wrap;
    border-bottom: 3px solid ${GOLD};
  }
  .hd-brand  { display: flex; flex-direction: column; }
  .hd-title  { color: #fff; font-size: 15px; font-weight: 800; }
  .hd-store  { color: rgba(255,255,255,.55); font-size: 11px; }
  .hd-right  { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

  /* WEEK NAV */
  .week-nav  { display: flex; align-items: center; gap: 4px; }
  .wk-btn {
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2);
    color: #fff; border-radius: 6px; width: 26px; height: 26px; cursor: pointer;
    font-size: 15px; display: flex; align-items: center; justify-content: center;
  }
  .wk-btn:hover { background: rgba(255,255,255,.22); }
  .wk-label { color: rgba(255,255,255,.85); font-size: 12px; font-weight: 600; white-space: nowrap; }

  /* PRINT BUTTONS */
  .btn-blank, .btn-filled {
    padding: 5px 11px; border-radius: 6px; font-size: 12px; font-weight: 700;
    cursor: pointer; border: none;
  }
  .btn-blank  { background: rgba(255,255,255,.14); color: #fff; border: 1px solid rgba(255,255,255,.25); }
  .btn-blank:hover  { background: rgba(255,255,255,.24); }
  .btn-filled { background: ${GOLD}; color: ${NAVY}; }
  .btn-filled:hover { opacity: .88; }

  /* TAB NAV */
  .tab-nav {
    display: flex; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
    gap: 5px; padding: 10px 12px 0; background: ${NAVY};
  }
  .tab-nav::-webkit-scrollbar { display: none; }
  .tab-pill {
    flex-shrink: 0; padding: 7px 13px; border-radius: 18px 18px 0 0;
    border: 1.5px solid rgba(255,255,255,.2); border-bottom: none;
    background: rgba(255,255,255,.07); color: rgba(255,255,255,.55);
    font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap;
    transition: all .15s;
  }
  .tab-pill:hover { color: #fff; background: rgba(255,255,255,.14); }
  .tab-pill.on    { background: #f0f2f5; color: ${NAVY}; border-color: #f0f2f5; }

  /* CONTENT */
  .content  { padding: 12px; }
  .panel    { display: none; }
  .panel.active { display: block; }

  /* DAY PICKER */
  .day-picker {
    display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px;
  }
  .dpick {
    padding: 6px 14px; border-radius: 20px; border: 2px solid;
    font-size: 13px; font-weight: 800; cursor: pointer; background: transparent;
    transition: all .15s; letter-spacing: .3px;
  }
  .dpick:hover { opacity: .75; }
  .dpick.on { box-shadow: 0 2px 8px rgba(0,0,0,.25); }

  /* SHEET CARD */
  .sheet-card {
    background: #fff; border-radius: 10px; overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,.10); max-width: 680px;
  }
  .sheet-title {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; flex-wrap: wrap; gap: 6px;
  }
  .sheet-title-main { color: #fff; font-size: 14px; font-weight: 800; }
  .sheet-date-line  { color: rgba(255,255,255,.75); font-size: 12px; }

  /* SAVE BADGE */
  .save-badge {
    background: #1E8C45; color: #fff; font-size: 11px; font-weight: 700;
    padding: 4px 10px; border-radius: 12px; animation: fadeIn .2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: scale(1); } }

  /* FORM TABLE */
  .form-table { width: 100%; }
  .form-thead {
    display: grid; grid-template-columns: 1fr 50px 72px 62px;
    padding: 6px 12px; background: #f7f8fa;
    border-bottom: 2px solid #e4e6ec;
    font-size: 10px; font-weight: 800; text-transform: uppercase;
    color: #666; letter-spacing: .4px; gap: 6px;
  }
  /* 5-column variant for Breakfast */
  .form-thead.bf { grid-template-columns: 1fr 50px 72px 62px 80px; }
  .form-trow {
    display: grid; grid-template-columns: 1fr 50px 72px 62px;
    padding: 5px 12px; align-items: center; gap: 6px;
    border-bottom: 1px solid #f0f2f5;
  }
  .form-trow.bf { grid-template-columns: 1fr 50px 72px 62px 80px; }
  .form-trow.alt  { background: #f8f9fb; }
  .form-trow.cond .ft-item { font-style: italic; color: #999; }
  .ft-item { font-size: 13px; color: #1a1a1a; }
  .ft-num  { font-size: 10px; text-align: center; color: #666; }

  /* Section divider inside form table */
  .sec-divider {
    padding: 6px 12px; font-size: 11px; font-weight: 800;
    border-top: 2px solid; letter-spacing: .3px; background: #fafbfc;
    text-transform: uppercase;
  }

  /* INPUTS */
  .fi {
    width: 100%; text-align: center; font-size: 14px; font-weight: 700;
    border: 1.5px solid #dde0e8; border-radius: 6px; padding: 4px 2px;
    color: ${NAVY}; background: #fff; appearance: textfield;
    transition: border-color .15s;
  }
  .fi:focus { outline: none; border-color: #1565C0; background: #f0f4ff; }
  .fi::-webkit-outer-spin-button,
  .fi::-webkit-inner-spin-button { -webkit-appearance: none; }
  .fi.init { color: #555; font-size: 12px; }

  /* WEEKLY MENU DISPLAY */
  .pull-night-card {
    text-align: center; padding: 40px 20px;
    background: linear-gradient(135deg,rgba(74,35,90,.04),rgba(74,35,90,.10));
  }
  .pn-title { font-size: 20px; font-weight: 800; color: #4A235A; margin-top: 10px; }
  .pn-sub   { font-size: 13px; color: #777; margin-top: 6px; }
  .menu-display { padding: 10px 0; }
  .menu-section { margin-bottom: 2px; }
  .menu-sec-label {
    color: #fff; font-size: 11px; font-weight: 800; letter-spacing: .6px;
    text-transform: uppercase; padding: 5px 14px;
  }
  .menu-item {
    font-size: 14px; padding: 7px 14px; border-bottom: 1px solid #f0f2f5;
    color: #1a1a1a;
  }
  .menu-item:nth-child(even) { background: #f8f9fb; }

  /* PRINT ONLY */
  .print-only { display: none; }

  /* PRINT */
  @media print {
    .no-print   { display: none !important; }
    .print-only { display: block !important; }
    body { background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    @page { size: letter portrait; margin: 0.4in; }

    .content  { padding: 0; }
    .panel    { display: block !important; page-break-after: always; }
    .panel:last-child { page-break-after: avoid; }

    .day-picker { display: none !important; }
    .sheet-card { box-shadow: none; border: 1px solid #ccc; max-width: 100%; }
    .sheet-title { padding: 7px 10px; }
    .sheet-title-main { font-size: 12px; }
    .form-thead { font-size: 9px; padding: 4px 10px; }
    .form-thead.bf { grid-template-columns: 1fr 44px 64px 54px 70px; }
    .form-trow  { padding: 3px 10px; }
    .form-trow.bf { grid-template-columns: 1fr 44px 64px 54px 70px; }
    .ft-item    { font-size: 10px; }
    .sec-divider { font-size: 9px; padding: 4px 10px; }

    .fi {
      border: none; border-bottom: 1px solid #999; border-radius: 0;
      background: transparent; color: #000; font-size: 11px; padding: 1px;
    }
    body.print-blank .fi { color: transparent !important; }

    .menu-item { font-size: 11px; padding: 4px 10px; }
    .menu-sec-label { font-size: 9px; padding: 3px 10px; }

    .print-sec-hdr {
      font-size: 14px; font-weight: 900; color: ${NAVY};
      border-bottom: 2px solid ${GOLD}; padding-bottom: 5px; margin-bottom: 10px;
    }
    .print-header {
      text-align: center; font-size: 11px; color: #444;
      border-bottom: 1.5px solid ${NAVY}; padding-bottom: 5px; margin-bottom: 10px;
    }
  }
`;

ReactDOM.createRoot(document.getElementById('root')).render(<WeeklyMenuApp/>);
</script>
</body>
</html>
